name: Build with jlink

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Build and package on macOS
        if: matrix.os == 'macos-latest'
        run: |
          rm -rf app
          mkdir -p app/jre
          jlink --add-modules ALL-MODULE-PATH --output app/jre --strip-debug --compress=2 --no-header-files --no-man-pages
          mkdir -p app/bin
          echo '#!/bin/bash' > app/bin/TargetTool
          echo 'DIR="$(dirname "$0")"' >> app/bin/TargetTool
          echo '"$DIR/jre/bin/java" -jar "$DIR/../target-tool-1.0.0.jar" "$@"' >> app/bin/TargetTool
          chmod +x app/bin/TargetTool
          cp target/target-tool-1.0.0.jar app/
          tar -czvf TargetTool-macos-latest.tar.gz app/

      - name: Build and package on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: |
          rm -rf app
          mkdir -p app/jre
          jlink --add-modules ALL-MODULE-PATH --output app/jre --strip-debug --compress=2 --no-header-files --no-man-pages
          mkdir -p app/bin
          echo '#!/bin/bash' > app/bin/TargetTool
          echo 'DIR="$(dirname "$0")"' >> app/bin/TargetTool
          echo '"$DIR/jre/bin/java" -jar "$DIR/../target-tool-1.0.0.jar" "$@"' >> app/bin/TargetTool
          chmod +x app/bin/TargetTool
          cp target/target-tool-1.0.0.jar app/
          tar -czvf TargetTool-ubuntu-latest.tar.gz app/

      - name: Build and package on Windows
        if: matrix.os == 'windows-latest'
        run: |
          Remove-Item -Recurse -Force app -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path app/jre
          jlink --add-modules ALL-MODULE-PATH --output app/jre --strip-debug --compress=2 --no-header-files --no-man-pages
          New-Item -ItemType Directory -Path app/bin
          '@echo off' | Out-File -FilePath app/bin/TargetTool.bat -Encoding ASCII
          'set DIR=%~dp0' | Out-File -FilePath app/bin/TargetTool.bat -Append -Encoding ASCII
          'call "%DIR%jre\bin\java.exe" -jar "%DIR%..\target-tool-1.0.0.jar" %*' | Out-File -FilePath app/bin/TargetTool.bat -Append -Encoding ASCII
          Copy-Item target/target-tool-1.0.0.jar app/
          Compress-Archive -Path app -DestinationPath TargetTool-windows-latest.zip

      - name: Create archive
        run: |
          case ${{ matrix.os }} in
            macos-latest|ubuntu-latest)
              tar -czvf TargetTool-${{ matrix.os }}.tar.gz app/
              ;;
            windows-latest)
              powershell -Command "Compress-Archive -Path app -DestinationPath TargetTool-windows-latest.zip"
              ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TargetTool-${{ matrix.os }}-jlink
          path: TargetTool-*.tar.gz TargetTool-*.zip

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Extract Linux artifact
        run: tar -xzvf artifacts/*/TargetTool-ubuntu-latest.tar.gz

      - name: Test Linux executable
        run: ./app/bin/TargetTool

      - name: Test Windows artifact (via wine or skip)
        run: echo "Windows exe test skipped - use Windows runner"

      - name: Test macOS artifact
        run: |
          tar -xzvf artifacts/*/TargetTool-macos-latest.tar.gz
          ./app/bin/TargetTool
