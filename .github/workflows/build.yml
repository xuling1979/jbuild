name: Build with jlink

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Build jlink for ${{ matrix.os }}
        run: |
          case ${{ matrix.os }} in
            macos-latest)
              mkdir -p app/jre
              jlink --add-modules ALL-MODULE-PATH --output app/jre --strip-debug --compress=2 --no-header-files --no-man-pages
              mkdir -p app/bin
              echo '#!/bin/bash' > app/bin/TargetTool
              echo 'DIR="$(dirname "$0")"' >> app/bin/TargetTool
              echo '"$DIR/jre/bin/java" -jar "$DIR/../target-tool-1.0.0.jar" "$@"' >> app/bin/TargetTool
              chmod +x app/bin/TargetTool
              cp target/target-tool-1.0.0.jar app/
              ;;
            ubuntu-latest)
              mkdir -p app/jre
              jlink --add-modules ALL-MODULE-PATH --output app/jre --strip-debug --compress=2 --no-header-files --no-man-pages
              mkdir -p app/bin
              echo '#!/bin/bash' > app/bin/TargetTool
              echo 'DIR="$(dirname "$0")"' >> app/bin/TargetTool
              echo '"$DIR/jre/bin/java" -jar "$DIR/../target-tool-1.0.0.jar" "$@"' >> app/bin/TargetTool
              chmod +x app/bin/TargetTool
              cp target/target-tool-1.0.0.jar app/
              ;;
            windows-latest)
              mkdir -p app/jre
              jlink --add-modules ALL-MODULE-PATH --output app/jre --strip-debug --compress=2 --no-header-files --no-man-pages
              mkdir -p app/bin
              echo '@echo off' > app/bin/TargetTool.bat
              echo 'set DIR=%~dp0' >> app/bin/TargetTool.bat
              echo 'call "%DIR%jre\bin\java.exe" -jar "%DIR%..\target-tool-1.0.0.jar" %*' >> app/bin/TargetTool.bat
              cp target/target-tool-1.0.0.jar app/
              ;;
          esac

      - name: Create archive
        run: |
          case ${{ matrix.os }} in
            macos-latest|ubuntu-latest)
              tar -czvf TargetTool-${{ matrix.os }}.tar.gz app/
              ;;
            windows-latest)
              powershell -Command "Compress-Archive -Path app -DestinationPath TargetTool-windows-latest.zip"
              ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TargetTool-${{ matrix.os }}-jlink
          path: TargetTool-*.tar.gz TargetTool-*.zip 2>/dev/null || out-*/*

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Extract Linux artifact
        run: tar -xzvf artifacts/*/TargetTool-ubuntu-latest.tar.gz

      - name: Test Linux executable
        run: ./app/bin/TargetTool

      - name: Test Windows artifact (via wine or skip)
        run: echo "Windows exe test skipped - use Windows runner"

      - name: Test macOS artifact
        run: |
          tar -xzvf artifacts/*/TargetTool-macos-latest.tar.gz
          ./app/bin/TargetTool
