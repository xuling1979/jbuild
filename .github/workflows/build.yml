name: Build Multi-Platform Packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Prepare clean input directory
        run: mkdir input && cp target/target-tool-*.jar input/target-tool.jar

      - name: Build macOS app-image
        if: matrix.os == 'macos-latest'
        run: jpackage --type app-image --input input --main-jar target-tool.jar --name TargetTool -d out-macos

      - name: Build Ubuntu deb
        if: matrix.os == 'ubuntu-latest'
        run: jpackage --type deb --input input --main-jar target-tool.jar --name TargetTool -d out-ubuntu

      - name: Build Windows msi
        if: matrix.os == 'windows-latest'
        run: jpackage --type msi --input input --main-jar target-tool.jar --name TargetTool -d out-windows

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TargetTool-${{ matrix.os }}
          path: out-*/*

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/
